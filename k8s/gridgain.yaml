apiVersion: v1
kind: Namespace
metadata:
  name: dr
---
# ---------------------------------------------------------------------------
# GridGain 9.2 node configuration + helper scripts
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: gg-config
  namespace: dr
data:
  gridgain-config.conf: |
    ignite {
      network {
        port = 3344
        nodeFinder {
          type = STATIC
          nameResolutionAttempts = 10
          # Seed nodes only: the first three ordinals are also the CMG / Metastorage group.
          netClusterNodes = ["gg-0.gg:3344", "gg-1.gg:3344", "gg-2.gg:3344"]
        }
      }
      storage.profiles {
        default {
          engine = aipersist
          sizeBytes = 402653184
        }
      }
      # Smaller raft log segments than the 2 GB default. The soft limits must stay well above the working size: set too low
      # the log GC spins continuously ("above the soft limit but no files to compact") and starves the raft write path.
      logStorage {
        segmentFileSizeBytes = 134217728
        softLogSizeLimitBytes = 2147483648
      }
      raft.logStorage.softPartitionsLogSizeLimitBytes = 2147483648
      # fail fast: a node that hits a critical error exits and is restarted by the wrapper instead of lingering half-stopped
      failureHandler.handler.type = stopOrHalt
    }
  # Wrapper that lets the demo "kill" a node without Kubernetes rescheduling it:
  # touching /fail/down kills the JVM and keeps it down until the marker is removed.
  run.sh: |
    #!/bin/sh
    PID=""
    term() { [ -n "$PID" ] && kill -TERM "$PID" 2>/dev/null; wait "$PID" 2>/dev/null; exit 0; }
    trap term TERM INT
    while true; do
      while [ -f /fail/down ]; do sleep 1; done
      docker-entrypoint.sh --node-name "$HOSTNAME" &
      PID=$!
      while kill -0 "$PID" 2>/dev/null; do
        if [ -f /fail/down ]; then kill -9 "$PID" 2>/dev/null; break; fi
        sleep 1
      done
      wait "$PID" 2>/dev/null
      PID=""
      [ -f /fail/down ] || { echo "node process exited, restarting"; sleep 2; }
    done
  init-cluster.sh: |
    #!/bin/sh
    # Initialise the cluster (idempotent) and create the payments schema. Run on gg-0.
    DC_ID="$1"
    REST=http://localhost:10300/management/v1
    if wget -qO- $REST/cluster/state >/dev/null 2>&1; then
      echo "cluster already initialised"
    else
      LIC=$(tr -d '\n' < /license/gridgain-license.json | sed 's/\\/\\\\/g; s/"/\\"/g')
      BODY="{\"metaStorageNodes\":[\"gg-0\",\"gg-1\",\"gg-2\"],\"cmgNodes\":[\"gg-0\",\"gg-1\",\"gg-2\"],\"clusterName\":\"$DC_ID\",\"license\":\"$LIC\"}"
      wget -qO- --header 'Content-Type: application/json' --post-data "$BODY" $REST/cluster/init || exit 1
      echo "init sent"
    fi
    for i in $(seq 1 60); do
      wget -qO- $REST/cluster/state >/dev/null 2>&1 && break
      sleep 2
    done
    echo "cluster initialised"
  schema.sql: |
    CREATE ZONE IF NOT EXISTS PAY (REPLICAS 3, PARTITIONS 12, AUTO SCALE UP 0, AUTO SCALE DOWN 30) STORAGE PROFILES ['default'];
    -- Reference data, written once. Never updated, so it cannot produce conflicting versions across DCs.
    CREATE TABLE IF NOT EXISTS ACCOUNTS (
      ID INT PRIMARY KEY, OWNER VARCHAR(40), HOME_DC VARCHAR(8),
      STATUS VARCHAR(10), CURRENCY VARCHAR(3), DAILY_LIMIT DECIMAL(18,2)
    ) ZONE PAY;
    -- Insert-only payment ledger: a payment id is written once, by exactly one DC, so active/active needs no conflict resolution.
    CREATE TABLE IF NOT EXISTS PAYMENTS (
      ID VARCHAR(40) PRIMARY KEY, FROM_ACC INT, TO_ACC INT, AMOUNT DECIMAL(18,2),
      STATUS VARCHAR(16), ORIGIN_DC VARCHAR(8), SERVED_DC VARCHAR(8), CREATED_AT BIGINT
    ) ZONE PAY;
    CREATE INDEX IF NOT EXISTS IDX_PAY_CREATED ON PAYMENTS (CREATED_AT);
    -- One row per DC per second; used to measure replication lag.
    CREATE TABLE IF NOT EXISTS HEARTBEAT (
      ID VARCHAR(30) PRIMARY KEY, DC VARCHAR(8), TS BIGINT
    ) ZONE PAY;
    CREATE INDEX IF NOT EXISTS IDX_HB_TS ON HEARTBEAT (TS);
---
apiVersion: v1
kind: Service
metadata:
  name: gg
  namespace: dr
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: gg }
  ports:
  - { name: client, port: 10800 }
  - { name: rest, port: 10300 }
  - { name: cluster, port: 3344 }
---
# Only Ready pods: used by the payments-api thin client to find live nodes.
apiVersion: v1
kind: Service
metadata:
  name: gg-ready
  namespace: dr
spec:
  clusterIP: None
  selector: { app: gg }
  ports:
  - { name: client, port: 10800 }
---
# Published on the host so peer DCs (via their WAN emulator) can attach DCR to us.
apiVersion: v1
kind: Service
metadata:
  name: gg-xdc
  namespace: dr
spec:
  type: NodePort
  selector: { app: gg }
  ports:
  - { name: client, port: 10800, targetPort: 10800, nodePort: 30800 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gg
  namespace: dr
spec:
  serviceName: gg
  replicas: __INITIAL_NODES__
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: gg }
  template:
    metadata:
      labels: { app: gg, dr/dc: __DC_ID__ }
    spec:
      securityContext: { fsGroup: 1001 }
      terminationGracePeriodSeconds: 20
      containers:
      - name: gg
        image: __GG_IMAGE__
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/ops/run.sh"]
        env:
        - { name: JVM_MAX_MEM, value: "1536m" }
        - { name: JVM_MIN_MEM, value: "1536m" }
        - { name: JVM_G1HeapRegionSize, value: "4M" }
        ports:
        - { containerPort: 10800 }
        - { containerPort: 10300 }
        - { containerPort: 3344 }
        resources:
          requests: { cpu: 250m, memory: 2Gi }
          limits: { cpu: "3", memory: 3584Mi }
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "wget -qO- http://localhost:10300/management/v1/node/state | grep -q STARTED"]
          periodSeconds: 2
          failureThreshold: 1
          timeoutSeconds: 2
        volumeMounts:
        - { name: data, mountPath: /opt/gridgain/work }
        - { name: fail, mountPath: /fail }
        - { name: ops, mountPath: /ops }
        - { name: ops, mountPath: /opt/gridgain/etc/gridgain-config.conf, subPath: gridgain-config.conf }
        - { name: license, mountPath: /license }
      volumes:
      - { name: fail, emptyDir: {} }
      - name: ops
        configMap: { name: gg-config, defaultMode: 0755 }
      - name: license
        secret: { secretName: gg-license, optional: true }
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: { requests: { storage: 2Gi } }
---
# Admin pod: the GridGain CLI is a JVM of its own, so it must NOT be exec'd inside the node containers
# (that OOM-kills the node). The dc-agent runs `dcr ...` and SQL commands here instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gg-cli
  namespace: dr
spec:
  replicas: 1
  selector:
    matchLabels: { app: gg-cli }
  template:
    metadata:
      labels: { app: gg-cli }
    spec:
      containers:
      - name: cli
        image: __GG_IMAGE__
        imagePullPolicy: IfNotPresent
        command: ["sleep", "infinity"]
        env:
        - { name: GRIDGAIN9_OPTS, value: "-Xmx256m -Xms64m -XX:+UseSerialGC" }
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { memory: 700Mi }
        volumeMounts:
        - { name: ops, mountPath: /ops }
      volumes:
      - name: ops
        configMap: { name: gg-config, defaultMode: 0755 }
