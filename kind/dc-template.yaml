kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: __DC_ID__
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: __API_PORT__
kubeadmConfigPatches:
- |
  kind: ClusterConfiguration
  apiServer:
    certSANs: ["127.0.0.1", "localhost", "__HOST_IP__", "__HOST_NAME__"]
nodes:
- role: control-plane
  extraPortMappings:
  - { containerPort: 30700, hostPort: __LB_PORT__,    listenAddress: "0.0.0.0" }   # DC load balancer (also used by peer DCs for failover)
  - { containerPort: 30800, hostPort: __XDC_PORT__,   listenAddress: "0.0.0.0" }   # GridGain client port (DCR source for peer DCs)
  - { containerPort: 30900, hostPort: __AGENT_PORT__, listenAddress: "0.0.0.0" }   # dc-agent API (dashboard)
